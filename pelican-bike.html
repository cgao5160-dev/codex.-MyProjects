<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的海岸骑行</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f7f3e9;color:#214c4a;font-family:system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px}
  main{width:min(1060px,100%)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}small{font-size:11px;font-weight:700;letter-spacing:4px;color:#6d8880}h1{font-size:clamp(28px,4vw,46px);font-weight:600;letter-spacing:2px;margin:12px 0 8px}p{margin:0;color:#748880;font-size:14px}.stamp{font-size:12px;letter-spacing:2px;border:1px solid #b7c7b9;padding:10px 15px;border-radius:25px;white-space:nowrap}
  .scene{background:#e8efdf;border:1px solid #d6dfcf;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px #26443a0b}svg{display:block;width:100%;height:auto}footer{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 2px;color:#748880;font-size:12px}.controls{display:flex;align-items:center;gap:13px}button{border:0;border-radius:30px;background:#275955;color:white;padding:10px 20px;font:inherit;cursor:pointer}button:hover{background:#39756b}input{width:100px;accent-color:#d97848}label{display:flex;align-items:center;gap:9px}.fine{letter-spacing:2px}button:focus-visible,input:focus-visible{outline:3px solid #d97848;outline-offset:4px}@media(max-width:600px){body{padding:18px}header{align-items:start}.stamp{display:none}footer{flex-wrap:wrap}.fine{font-size:10px}}
  .back-link{display:inline-block;margin-bottom:22px;color:#547367;font-size:12px;text-decoration:none;letter-spacing:1px}.back-link:hover{text-decoration:underline}.back-link:focus-visible{outline:3px solid #d97848;outline-offset:4px}.controls{flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <a class="back-link" href="index.html#work">← 返回作品</a>
  <header><div><small>COASTAL CYCLING CLUB</small><h1>今天，慢慢骑。</h1><p>一只鹈鹕，一辆单车，一路海风。</p></div><span class="stamp">海岸漫游 · 01</span></header>
  <div class="scene">
  <svg id="art" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
    <title id="title">鹈鹕骑自行车的二维动画</title><desc id="desc">戴着绿色小帽、系着橙色围巾的白色鹈鹕，在海岸边骑着橙色自行车。车轮和脚踏连续转动，云朵和路旁植物向后移动。</desc>
    <defs>
      <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#edf1df"/><stop offset="1" stop-color="#dce9df"/></linearGradient>
      <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#a8cec2"/><stop offset="1" stop-color="#c9ddd0"/></linearGradient>
      <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".55" fill="#456d59" opacity=".08"/></pattern>
      <g id="cloud" fill="#fffdf3"><path d="M-60 0 Q-70-20-45-23 Q-37-53-10-36 Q12-61 29-34 Q56-40 61-17 Q88-12 74 0Z"/></g>
      <g id="wheel" stroke="#294e4c"><circle r="79" stroke-width="12" fill="#e9eee0"/><circle r="69" stroke="#fcf8e9" stroke-width="3" fill="none"/><g stroke="#829c8c" stroke-width="1.5"><path d="M-68 0H68M0-68V68M-48-48L48 48M-48 48L48-48M-63-26L63 26M-26-63L26 63M-63 26L63-26M-26 63L26-63"/></g><circle r="8" fill="#f1e8ce" stroke-width="3"/><path d="M35-59l8 5" stroke="#e8ac62" stroke-width="5" stroke-linecap="round"/></g>
      <g id="grass" fill="none" stroke="#6d927a" stroke-width="3" stroke-linecap="round"><path d="M0 0Q-2-16-12-24M0 0Q0-24 8-33M0 0Q10-16 18-17"/></g>
    </defs>
    <path fill="url(#sky)" d="M0 0H1000V600H0z"/>
    <circle cx="793" cy="114" r="47" fill="#e9b66e"/><circle cx="793" cy="114" r="62" fill="none" stroke="#e9b66e" opacity=".2"/>
    <g id="clouds"><use href="#cloud" x="155" y="108" opacity=".85"/><use href="#cloud" x="558" y="74" opacity=".65"/><use href="#cloud" x="960" y="166" opacity=".8"/></g>
    <path d="M0 296Q120 240 238 283T472 280Q560 245 650 279T1000 269V370H0Z" fill="#bacfba"/>
    <path d="M0 320Q145 293 310 316T620 308T1000 316V426H0Z" fill="url(#sea)"/>
    <g stroke="#eff2dd" stroke-width="3" stroke-linecap="round" opacity=".7"><path d="M40 348H126M175 374H279M712 350H790M849 389H958M580 387H631M350 343H400"/></g>
    <path d="M0 411Q230 386 437 410T1000 402V600H0Z" fill="#e5dfbb"/>
    <path d="M0 460Q480 443 1000 460V600H0Z" fill="#ede8d5"/>
    <path d="M0 462Q480 445 1000 462" fill="none" stroke="#c9c9aa" stroke-width="2"/>
    <g id="road" stroke="#c9c3a6" stroke-width="4" stroke-linecap="round"><path d="M0 530h75m100 0h75m100 0h75m100 0h75m100 0h75m100 0h75m100 0h75"/></g>
    <g id="plants"><use href="#grass" x="85" y="453"/><use href="#grass" x="845" y="448"/><use href="#grass" x="1020" y="459"/></g>
    <ellipse cx="500" cy="499" rx="207" ry="13" fill="#687663" opacity=".13"/>
    <g id="rider">
      <g transform="translate(354 413)"><g class="spin"><use href="#wheel"/></g></g>
      <g transform="translate(645 413)"><g class="spin"><use href="#wheel"/></g></g>
      <!-- Far leg passes behind the bicycle frame. -->
      <path id="farLeg" fill="none" stroke="#c08b49" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="farFoot" fill="#d99e4a" stroke="#b77e3b" stroke-width="2"/>
      <g fill="none" stroke="#d77548" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"><path d="M354 413L422 301L486 413H354L575 301L645 413M486 413L575 301M422 301H575"/><path d="M422 301L410 277M575 301L566 263"/></g>
      <path d="M566 263L587 246L613 247" fill="none" stroke="#335957" stroke-width="7" stroke-linecap="round"/><path d="M603 247h17" stroke="#9a6748" stroke-width="9" stroke-linecap="round"/>
      <path d="M388 277Q410 269 437 277" stroke="#31504a" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M354 413L486 413" stroke="#718575" stroke-width="3"/>
      <circle cx="486" cy="413" r="19" fill="#e8bd77" stroke="#345754" stroke-width="4"/>
      <g id="crank" stroke="#315653" stroke-width="5" stroke-linecap="round"><path d="M-29 0H29"/><path d="M-37 0h16M21 0h16" stroke-width="7"/></g>
      <g id="bird">
        <!-- Tail, body, curled neck and distinctive long pelican bill. -->
        <path d="M379 263L330 226L348 278L393 290" fill="#e5e6d5" stroke="#3e6057" stroke-width="3" stroke-linejoin="round"/>
        <path d="M365 242C379 211 423 201 462 221C496 237 514 261 499 282C486 303 411 309 381 285C367 275 360 260 365 242Z" fill="#fffcef" stroke="#3e6057" stroke-width="3"/>
        <path d="M461 246C496 238 504 212 501 182C497 159 493 135 506 121C519 106 547 113 550 132C555 157 529 170 534 194C541 222 531 259 499 276" fill="#fffcef" stroke="#3e6057" stroke-width="3"/>
        <path d="M542 140L680 158Q633 192 551 174L537 160Z" fill="#eab65f" stroke="#966b3e" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M547 140L682 157L548 157" fill="#edaa4b" stroke="#966b3e" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M561 166Q610 181 652 164" fill="none" stroke="#f6d58e" stroke-width="3"/>
        <circle cx="535" cy="132" r="4.5" fill="#264b47"/><circle cx="536" cy="130.5" r="1.3" fill="white"/>
        <path d="M516 147q6 4 11 0" fill="none" stroke="#dcc6a1" stroke-width="3" stroke-linecap="round"/>
        <path d="M497 119Q495 92 518 94Q538 94 541 116" fill="#3d7667" stroke="#315b52" stroke-width="2.5"/>
        <path d="M491 119Q519 109 553 120" fill="none" stroke="#315b52" stroke-width="7" stroke-linecap="round"/>
        <path id="scarfTail" d="M509 195Q475 180 442 195L449 208Q476 192 507 206" fill="#d87449"/>
        <path d="M503 187L536 191L534 203L506 200Z" fill="#e58b54" stroke="#c87043" stroke-width="2"/>
        <path d="M399 238Q429 223 458 249Q483 266 502 248L584 245" fill="none" stroke="#547367" stroke-width="19" stroke-linecap="round"/>
        <path d="M398 234Q429 220 459 245Q482 261 499 245L581 242" fill="none" stroke="#eeeede" stroke-width="15" stroke-linecap="round"/>
        <path d="M393 258Q414 277 448 267" fill="none" stroke="#ccd4bf" stroke-width="3" stroke-linecap="round"/>
      </g>
      <path id="nearLeg" fill="none" stroke="#dba34e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="nearFoot" fill="#efb65a" stroke="#b6843f" stroke-width="2"/>
    </g>
    <g fill="none" stroke="#6d8d79" stroke-width="2.5" stroke-linecap="round" opacity=".55"><path d="M262 223h35m-53 17h39m-14 17h20"/></g>
    <path fill="url(#grain)" pointer-events="none" d="M0 0H1000V600H0z"/>
    <text x="35" y="570" font-family="system-ui,sans-serif" font-size="10" letter-spacing="3" fill="#89947c">TAKE THE SCENIC ROUTE</text>
  </svg>
  </div>
  <footer><div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停骑行</button><label for="speed">速度 <input id="speed" type="range" min="0.4" max="2" value="1" step="0.1"></label></div><span class="fine">海风正好 · 不必赶路</span></footer>
</main>
<script>
  const $=id=>document.getElementById(id);
  let paused=matchMedia('(prefers-reduced-motion: reduce)').matches, time=0, last=null;
  const button=$('toggle');
  function syncButton(){button.textContent=paused?'继续骑行':'暂停骑行';button.setAttribute('aria-pressed',String(paused));}
  syncButton();button.addEventListener('click',()=>{paused=!paused;syncButton();});
  function leg(side,angle){
    const x=486+29*Math.cos(angle), y=413+29*Math.sin(angle);
    // Two fixed-length limb segments meet at a solved knee joint.
    const hx=438,hy=286, upper=86,lower=87,dx=x-hx,dy=y-hy,d=Math.hypot(dx,dy);
    const a=(upper*upper-lower*lower+d*d)/(2*d),h=Math.sqrt(Math.max(0,upper*upper-a*a));
    const kx=hx+a*dx/d+h*dy/d,ky=hy+a*dy/d-h*dx/d;
    $(side+'Leg').setAttribute('d',`M${hx} ${hy}L${kx} ${ky}L${x} ${y}`);
    $(side+'Foot').setAttribute('d',`M${x-8} ${y-4}Q${x+4} ${y-7} ${x+19} ${y+2}L${x+24} ${y+7}L${x-8} ${y+7}Z`);
  }
  function draw(){
    const angle=time*3.8,deg=angle*180/Math.PI;
    document.querySelectorAll('.spin').forEach(w=>w.setAttribute('transform',`rotate(${deg*1.25})`));
    $('crank').setAttribute('transform',`translate(486 413) rotate(${deg})`);
    leg('far',angle+Math.PI);leg('near',angle);
    $('bird').setAttribute('transform',`translate(0 ${Math.sin(angle*2)*1.5})`);
    $('scarfTail').setAttribute('transform',`rotate(${Math.sin(time*8)*4} 509 198)`);
    // Wrap each cloud individually so the sky remains populated indefinitely.
    const positions=[155,558,960];
    [...$('clouds').children].forEach((c,i)=>c.setAttribute('x',((positions[i]-time*9+100)%1200+1200)%1200-100));
    $('road').setAttribute('transform',`translate(${-time*150%175} 0)`);
    [...$('plants').children].forEach((p,i)=>p.setAttribute('x',(( [85,845,1020][i]-time*150+100)%1200+1200)%1200-100));
  }
  function frame(now){if(last!==null&&!paused)time+=Math.min((now-last)/1000,.05)*Number($('speed').value);last=now;draw();requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
</script>
</body>
</html>
