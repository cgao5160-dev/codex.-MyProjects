        <path d="M365 242C379 211 423 201 462 221C496 237 514 261 499 282C486 303 411 309 381 285C367 275 360 260 365 242Z" fill="#fffcef" stroke="#3e6057" stroke-width="3"/>
        <path d="M461 246C496 238 504 212 501 182C497 159 493 135 506 121C519 106 547 113 550 132C555 157 529 170 534 194C541 222 531 259 499 276" fill="#fffcef" stroke="#3e6057" stroke-width="3"/>
        <path d="M542 140L680 158Q633 192 551 174L537 160Z" fill="#eab65f" stroke="#966b3e" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M547 140L682 157L548 157" fill="#edaa4b" stroke="#966b3e" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M561 166Q610 181 652 164" fill="none" stroke="#f6d58e" stroke-width="3"/>
        <circle cx="535" cy="132" r="4.5" fill="#264b47"/><circle cx="536" cy="130.5" r="1.3" fill="white"/>
        <path d="M516 147q6 4 11 0" fill="none" stroke="#dcc6a1" stroke-width="3" stroke-linecap="round"/>
        <path d="M497 119Q495 92 518 94Q538 94 541 116" fill="#3d7667" stroke="#315b52" stroke-width="2.5"/>
        <path d="M491 119Q519 109 553 120" fill="none" stroke="#315b52" stroke-width="7" stroke-linecap="round"/>
        <path id="scarfTail" d="M509 195Q475 180 442 195L449 208Q476 192 507 206" fill="#d87449"/>
        <path d="M503 187L536 191L534 203L506 200Z" fill="#e58b54" stroke="#c87043" stroke-width="2"/>
        <path d="M399 238Q429 223 458 249Q483 266 502 248L584 245" fill="none" stroke="#547367" stroke-width="19" stroke-linecap="round"/>
        <path d="M398 234Q429 220 459 245Q482 261 499 245L581 242" fill="none" stroke="#eeeede" stroke-width="15" stroke-linecap="round"/>
        <path d="M393 258Q414 277 448 267" fill="none" stroke="#ccd4bf" stroke-width="3" stroke-linecap="round"/>
      </g>
      <path id="nearLeg" d="M438 286L522 340L515 413" fill="none" stroke="#dba34e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="nearFoot" d="M507 409L530 410L539 420H507Z" fill="#efb65a" stroke="#b6843f" stroke-width="2"/>
    </g>
    <g fill="none" stroke="#6d8d79" stroke-width="2.5" stroke-linecap="round" opacity=".55"><path d="M262 223h35m-53 17h39m-14 17h20"/></g>
    <path fill="url(#grain)" pointer-events="none" d="M0 0H1000V600H0z"/>
    <text x="35" y="570" font-family="system-ui,sans-serif" font-size="10" letter-spacing="3" fill="#89947c">TAKE THE SCENIC ROUTE</text>
  </svg>
